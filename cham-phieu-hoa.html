<title>Chấm Phiếu Hoá</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Roboto+Slab:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: một cột kiểu "phiếu làm bài" trên nền giấy; thanh điểm dính trên, bàn phím chấm + thanh tab dính dưới */
:root{
  --paper:#eef2f1; --sheet:#ffffff; --ink:#18293a; --ink2:#5a6b7c; --line:#d3dce2;
  --pen:#1d4f7c; --pen-ink:#ffffff; --pen-soft:#e1ecf6;
  --ok:#2b7a35; --ok-soft:#e3f2e4; --bad:#c42b2b; --bad-soft:#fbe6e5; --warn:#975a00; --warn-soft:#fff1d6;
  --f-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"Roboto Slab", Georgia, "Times New Roman", serif;
  --f-cell:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1418; --sheet:#162028; --ink:#e3eaef; --ink2:#97a8b6; --line:#2b3843;
  --pen:#79b1e3; --pen-ink:#0a1620; --pen-soft:#1b3348;
  --ok:#72c779; --ok-soft:#163021; --bad:#ff8080; --bad-soft:#3b1c1e; --warn:#f2b660; --warn-soft:#382a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1418; --sheet:#162028; --ink:#e3eaef; --ink2:#97a8b6; --line:#2b3843;
  --pen:#79b1e3; --pen-ink:#0a1620; --pen-soft:#1b3348;
  --ok:#72c779; --ok-soft:#163021; --bad:#ff8080; --bad-soft:#3b1c1e; --warn:#f2b660; --warn-soft:#382a12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:64px}
.tb-title{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.tb-title h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;align-items:center;gap:10px}
.score-num{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1;color:var(--bad);font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:right}
.score-num.none{color:var(--ink2);font-size:24px}
.score-sub{font-size:11.5px;color:var(--ink2);line-height:1.3;text-align:right}
.score-sub b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--pen-soft);color:var(--pen);font-weight:600;white-space:nowrap}
.pill.local{background:var(--warn-soft);color:var(--warn)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

main{padding-block:14px 120px}
main.kp-open{padding-bottom:300px}
section{display:flex;flex-direction:column;gap:14px}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.part{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.part h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.part h2 small{font-weight:500;color:var(--ink2);font-size:12px}
.part h2 .got{font-family:var(--f-num);color:var(--bad);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--ink2);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px}
.fld textarea{resize:vertical;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-cell);font-weight:700;font-size:15px}
.chip small{font-family:var(--f-ui);font-weight:500;color:var(--ink2);font-size:11px;margin-right:4px}
.chip.on{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.chip.on small{color:inherit;opacity:.8}
.muted{color:var(--ink2);font-size:13px}
.hint{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.hint.info{background:var(--pen-soft);color:var(--pen)}
.hint .btn{min-height:34px;padding:0 12px;font-size:13px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.switch input{width:18px;height:18px;accent-color:var(--pen)}

/* answer cells */
.grid{display:grid;gap:6px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.cell i{font-style:normal;font-size:11px;color:var(--ink2);font-weight:600}
.cell b{font-family:var(--f-cell);font-size:20px;line-height:1.1;min-height:22px}
.g4 .cell b{font-size:17px}
.cell em{position:absolute;top:2px;right:4px;font-style:normal;font-family:var(--f-cell);font-size:11px;font-weight:700;color:var(--ok)}
.cell.ok{border-color:var(--ok);background:var(--ok-soft)}
.cell.ok b{color:var(--ok)}
.cell.bad{border-color:var(--bad);background:var(--bad-soft)}
.cell.bad b{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.cell.act{border-color:var(--pen);box-shadow:0 0 0 2px var(--pen)}
.cell.uns{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}
.cell.uns::after{content:"?";position:absolute;top:2px;left:5px;font-size:11px;font-weight:700;color:var(--warn)}

/* scan */
.scan-btns{display:grid;grid-template-columns:1fr auto;gap:10px}
.scan-btns .btn{white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.scan-status{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--pen);background:var(--pen-soft);border-radius:8px;padding:8px 8px 8px 12px}
.scan-status .sp{flex:1}
.scan-status .btn{min-height:36px;font-size:13px;padding:0 12px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.shot{display:block;width:100%;max-height:170px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.shot.big{max-height:none;object-fit:contain;cursor:zoom-out}

.tf-q{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:13.5px}
.tf-q small{color:var(--ink2);font-weight:500;font-size:12px}
.tf-q small b{font-family:var(--f-num);color:var(--bad)}
.tf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tf{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.tf>span{font-size:12px;color:var(--ink2);text-align:center;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:42px;font-weight:700;font-size:14px;background:var(--paper)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pen);color:var(--pen-ink)}
.seg.ok{border-color:var(--ok)} .seg.ok button.on{background:var(--ok);color:var(--sheet)}
.seg.bad{border-color:var(--bad)} .seg.bad button.on{background:var(--bad);color:var(--sheet)}
.seg.uns{border-style:dashed;border-color:var(--warn)}
.fld input.uns{border:1.5px dashed var(--warn);background:var(--warn-soft)}
.p2box{display:flex;flex-direction:column;gap:8px}
.p2box+.p2box{border-top:1px dashed var(--line);padding-top:10px}

.p4row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p4row>span{font-weight:600;font-size:13.5px;width:58px}
.p4row .chips{gap:6px;flex:1}
.p4row .chip{min-width:46px;padding:0 8px;font-size:14px}

.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.btn{min-height:48px;border-radius:9px;padding:0 16px;font-weight:600;border:1px solid var(--line);background:var(--sheet);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--sheet)}
.btn:disabled{opacity:.5}
.editbar{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.editbar .sp{flex:1;min-width:140px}
.editbar .btn{min-height:36px;font-size:13px;padding:0 12px}

/* keypad */
#keypad{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
#keypad .wrap{padding-block:8px 10px;display:flex;flex-direction:column;gap:6px}
.kp-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2)}
.kp-head b{color:var(--ink)}
.kp-head button{color:var(--pen);font-weight:600;padding:6px 4px}
.kp{display:grid;gap:6px}
.kp.k4{grid-template-columns:repeat(4,1fr)}
.kp.k3{grid-template-columns:repeat(3,1fr)}
.kp.k5{grid-template-columns:repeat(5,1fr)}
.key{min-height:50px;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-family:var(--f-cell);font-weight:700;font-size:20px}
.key.big{min-height:58px;font-size:24px}
.key.fn{font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--ink2)}
.key:active{background:var(--pen-soft)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:60px}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2)}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--pen)}

/* list */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:11px;color:var(--ink2);font-weight:600}
.stat b{font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
.dist{display:flex;flex-direction:column;gap:6px}
.dist-row{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.dist-row span:first-child{color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:4px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen);border-radius:4px}
.dist-row b{text-align:right;font-variant-numeric:tabular-nums}
.rows{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:11px 12px;width:100%;text-align:left;border-bottom:1px solid var(--line);min-height:54px}
.r:last-child{border-bottom:0}
.r .n{color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.r .nm{min-width:0}
.r .nm div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .nm small{color:var(--ink2);font-size:12px}
.r .cd{font-family:var(--f-cell);font-size:13px;color:var(--ink2)}
.r .sc{font-family:var(--f-num);font-weight:700;font-size:19px;color:var(--bad);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:15px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* keys */
.kgroup h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.kcard:last-child{border-bottom:0}
.kcard .cd{font-family:var(--f-cell);font-weight:700;font-size:18px;color:var(--pen);grid-row:span 2}
.kcard .ans{font-family:var(--f-cell);font-size:13px;letter-spacing:.12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kcard small{color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.p3in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.p3in label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink2);font-weight:600;text-align:center}
.p3in input{width:100%;text-align:center;font-family:var(--f-cell);font-weight:700;background:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:42px;padding:4px}
.mono{font-family:var(--f-cell);letter-spacing:.18em;font-weight:700;text-transform:uppercase}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg3 button{min-height:44px;font-weight:700;background:var(--paper)}
.seg3 button+button{border-left:1px solid var(--line)}
.seg3 button.on{background:var(--pen);color:var(--pen-ink)}
.err{color:var(--bad);font-size:13px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
main.kp-open~#toast{bottom:calc(300px + env(safe-area-inset-bottom,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:440px){.score-sub .brk{display:none}.score-sub{max-width:7.5em}}
@media (max-width:380px){.cell{min-height:52px}.cell b{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<header id="top"><div class="wrap" id="topIn"></div></header>

<main id="main"><div class="wrap">
  <section id="tab-grade">
    <div id="editBar"></div>
    <div class="card" id="scanCard">
      <div class="scan-btns">
        <button class="btn primary" data-act="scan-cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Chụp phiếu</button>
        <button class="btn" data-act="scan-pick">Chọn ảnh</button>
      </div>
      <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
      <input type="file" id="pickFile" accept="image/*" hidden>
      <div id="scanStatus"></div>
      <img id="shot" class="shot" alt="Ảnh phiếu vừa chụp, chạm để phóng to" data-act="shot" hidden>
    </div>
    <div class="card">
      <div class="row2">
        <label class="fld"><span>Kì kiểm tra</span><select id="examSel"></select></label>
        <label class="fld"><span>Lớp</span><input id="cls" autocomplete="off" autocapitalize="characters" placeholder="VD: 10A1"></label>
      </div>
      <label class="fld"><span>Họ và tên học sinh</span><input id="name" autocomplete="off" autocapitalize="words" placeholder="VD: Nguyễn Hoàng Kiều Trinh"></label>
      <div class="fld"><span>Mã đề</span><div id="codes" class="chips"></div></div>
      <div id="codeHint"></div>
      <label class="switch"><input type="checkbox" id="check" checked> Tô màu đúng / sai theo đáp án</label>
    </div>
    <div class="part"><h2>PHẦN I. Nhiều phương án <small>12 câu · 0,25 đ/câu</small><span class="got" id="g1"></span></h2><div id="p1" class="grid g6"></div></div>
    <div class="part"><h2>PHẦN II. Đúng – Sai <small>1/2/3/4 ý → 0,1/0,25/0,5/1 đ</small><span class="got" id="g2"></span></h2><div id="p2"></div></div>
    <div class="part"><h2>PHẦN III. Trả lời ngắn <small>8 câu · 0,25 đ/câu</small><span class="got" id="g3"></span></h2><div id="p3" class="grid g4"></div></div>
    <div class="part"><h2>PHẦN IV. Tự luận <small>3 câu · tối đa 1,0 đ/câu</small><span class="got" id="g4"></span></h2><div id="p4"></div></div>
    <label class="fld"><span>Ghi chú (nét chữ khó đọc, mã đề ghi sai…)</span><textarea id="note" rows="2"></textarea></label>
    <div class="actions"><button class="btn primary" data-act="save" id="btnSave">Lưu bài</button><button class="btn" data-act="clear">Phiếu mới</button></div>
  </section>

  <section id="tab-list" hidden></section>
  <section id="tab-keys" hidden></section>
</div></main>

<div id="keypad" hidden><div class="wrap" id="kpIn"></div></div>

<nav id="nav"><div class="wrap">
  <button data-act="tab" data-tab="grade" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Chấm bài</button>
  <button data-act="tab" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>Bảng điểm</button>
  <button data-act="tab" data-tab="keys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>Đáp án</button>
</div></nav>

<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
const N1=12, N3=8, P2PTS=[0,0.1,0.25,0.5,1], P4STEPS=[0,0.25,0.5,0.75,1];
const SCHOOL_YEAR="2026–2027";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- state ---------- */
let keys=[], results=[];
let mode="loading"; // loading | db | local
let db=null, downloads=null;
const blankDraft=()=>({id:null,name:"",cls:"",keyId:"",p1:Array(N1).fill(""),p2:[[ "","","",""],["","","",""]],p3:Array(N3).fill(""),p4:[null,null,null],note:"",createdAt:null,unsure:[]});

/* ---------- helpers ---------- */
function slug(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[đĐ]/g,"d").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"x"}
function gradeOf(cls){const m=String(cls).trim().match(/^(10|11|12)/);return m?m[1]:""}
function f2(x){return (Math.round(x*100)/100).toString().replace(".",",")}
function f1(x){return x.toFixed(1).replace(".",",")}
function round1(x){return Math.round(x*10+1e-9)/10}
const W=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function words(x){const t=Math.round(x*10),i=Math.floor(t/10),d=t%10;let s=i===10?"mười":W[i];if(d)s+=" phẩy "+W[d];return s.charAt(0).toUpperCase()+s.slice(1)}
function normShort(s){return String(s??"").trim().replace(/\s+/g,"").replace(/%$/,"").replace(/\./g,",").toUpperCase()}
function eqShort(a,b){const x=normShort(a),y=normShort(b);if(!x||!y)return false;const re=/^-?\d+(,\d+)?$/;if(re.test(x)&&re.test(y))return Math.abs(parseFloat(x.replace(",","."))-parseFloat(y.replace(",",".")))<1e-9;return x===y}
function sortName(a,b){const la=a.name.trim().split(/\s+/).pop()||"",lb=b.name.trim().split(/\s+/).pop()||"";return la.localeCompare(lb,"vi")||a.name.localeCompare(b.name,"vi")}
function keyById(id){return keys.find(k=>k.id===id)}
function exams(){const s=new Set(keys.map(k=>k.exam));results.forEach(r=>s.add(r.exam));return [...s].filter(Boolean)}
function newId(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function score(key,sh){
  if(!key)return null;
  let c1=0;for(let i=0;i<N1;i++)if(sh.p1[i]&&sh.p1[i]===key.p1[i])c1++;
  const c2=[0,1].map(q=>{let n=0;for(let j=0;j<4;j++)if(sh.p2[q][j]&&sh.p2[q][j]===key.p2[q][j])n++;return n});
  let c3=0;for(let i=0;i<N3;i++)if(eqShort(sh.p3[i],key.p3[i]))c3++;
  const s1=c1*0.25,s2=P2PTS[c2[0]]+P2PTS[c2[1]],s3=c3*0.25,s4=sh.p4.reduce((a,v)=>a+(+v||0),0);
  const raw=Math.round((s1+s2+s3+s4)*100)/100;
  return {c1,s1,c2,s2,c3,s3,s4,raw,total:round1(raw)};
}
function resScore(r){const k=keyById(r.keyId);return k?score(k,r):(r.sum||null)}

/* ---------- storage ---------- */
function persistLocal(){if(mode==="local"){LS.set("cb.keys",keys);LS.set("cb.results",results)}}
async function writeKey(k){if(mode==="db"){await db.collection("keys").doc(k.id).set(k)}else{const i=keys.findIndex(x=>x.id===k.id);if(i>=0)keys[i]=k;else keys.push(k);persistLocal();renderAll()}}
async function deleteKey(id){if(mode==="db"){await db.collection("keys").doc(id).delete()}else{keys=keys.filter(k=>k.id!==id);persistLocal();renderAll()}}
async function writeResult(r){if(mode==="db"){await db.collection("results").doc(r.id).set(r)}else{const i=results.findIndex(x=>x.id===r.id);if(i>=0)results[i]=r;else results.push(r);persistLocal();renderAll()}}
async function deleteResult(id){if(mode==="db"){await db.collection("results").doc(id).delete()}else{results=results.filter(r=>r.id!==id);persistLocal();renderAll()}}
function errMsg(e){const c=e&&e.code;if(c==="quota_exceeded")return "Bộ nhớ đã đầy, hãy xoá bớt bài cũ.";if(c==="invalid_argument")return "Bạn chỉ có quyền xem, không lưu được.";return "Chưa lưu được, thử lại sau giây lát."}

async function init(){
  renderAll();
  let d=null;
  try{if(window.claude&&typeof window.claude.use==="function"){
    [d,downloads,sampleFn]=await Promise.all([window.claude.use("db"),window.claude.use("downloads"),window.claude.use("sample")]);
    if(sampleFn){const lim=await sampleFn.limits().catch(()=>null);sampleImgMax=lim&&lim.images?lim.images.maxCount:0}
  }}catch(e){d=null}
  if(d){
    db=d;mode="db";
    db.collection("keys").onSnapshot(s=>{keys=s.docs.map(x=>Object.assign({id:x.id},x.data()));renderAll()},()=>toast("Mất kết nối dữ liệu đáp án."));
    db.collection("results").onSnapshot(s=>{results=s.docs.map(x=>Object.assign({id:x.id},x.data()));renderAll()},()=>toast("Mất kết nối bảng điểm."));
  }else{
    mode="local";keys=LS.get("cb.keys",[]);results=LS.get("cb.results",[]);
  }
  renderAll();
}

/* ---------- scan: đọc phiếu từ ảnh ---------- */
function apiKey(){return LS.get("cb.apikey","")}
function scanEngine(){if(sampleFn&&sampleImgMax>0)return"claude";if(!window.claude&&apiKey())return"api";return null}
function toJpeg(src,sx,sy,sw,sh,maxSide){
  const s=Math.min(1,maxSide/Math.max(sw,sh)),c=document.createElement("canvas");c.width=Math.round(sw*s);c.height=Math.round(sh*s);
  c.getContext("2d").drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",0.88));
}
async function prepImages(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){const url=URL.createObjectURL(file);try{src=new Image();src.src=url;await src.decode()}finally{URL.revokeObjectURL(url)}}
  const W=src.width||src.naturalWidth,H=src.height||src.naturalHeight;
  const out=[await toJpeg(src,0,0,W,H,2000)];
  // Ảnh dọc: thêm một ảnh cắt nửa trên (thông tin + Phần I–III) để chữ viết tay rõ hơn
  if(H>W*1.15)out.push(await toJpeg(src,0,0,W,Math.round(H*0.56),1800));
  return out;
}
function scanPrompt(n){return `${n>1?"Ảnh thứ nhất là cả tờ, ảnh thứ hai phóng to nửa trên của":"Ảnh là"} một "PHIẾU LÀM BÀI KIỂM TRA ĐỊNH KÌ – MÔN HOÁ HỌC" do học sinh viết tay. Ảnh có thể hơi nghiêng hoặc xoay. Hãy CHÉP LẠI đúng những gì học sinh viết; không tự sửa cho đúng, không đoán đáp án.

Bố cục phiếu:
- Ô thông tin: "Họ và tên học sinh", "Lớp", "Mã đề" viết tay trên dòng chấm.
- PHẦN I: bảng 2 hàng; hàng "Câu" ghi 1–12, hàng "Đáp án" mỗi ô một chữ A, B, C hoặc D.
- PHẦN II: hàng "Câu 13" và "Câu 14"; mỗi ý a), b), c), d) có 2 cột "Đúng" và "Sai"; học sinh đánh dấu X vào một cột.
- PHẦN III: hàng "Câu" ghi 15–22, hàng "Đáp án" là số (có thể có dấu phẩy thập phân, dấu trừ).
- PHẦN IV là tự luận: bỏ qua.

Quy tắc:
- Ô bị gạch chéo rồi viết lại: lấy đáp án viết lại sau cùng. Gạch mà không viết lại: coi là bỏ trống.
- Ô trống: "".
- Phần II: X ở cột Đúng → "D", ở cột Sai → "S"; không đánh, đánh cả hai cột hoặc không rõ → "" và ghi vào unsure.
- Phần III: chép số đúng như viết, dùng dấu phẩy thập phân (đổi dấu chấm thành dấu phẩy), giữ dấu trừ, bỏ đơn vị và dấu %.
- Lớp viết liền, ví dụ "10A1". Mã đề chỉ gồm chữ số.
- unsure: liệt kê mọi ô đọc không chắc chắn (nét chữ khó đọc, tẩy xoá, dễ nhầm như 1/7, 4/9, 0/6, A/D, B/D) bằng đúng các mã: "name", "cls", "code", "p1.1" … "p1.12", "p2.13a" … "p2.14d", "p3.15" … "p3.22".

Chỉ trả lời một đối tượng JSON dạng:
{"name":"…","cls":"…","code":"…","p1":[12 chuỗi],"p2":[[4 chuỗi cho câu 13],[4 chuỗi cho câu 14]],"p3":[8 chuỗi],"unsure":[…]}`}
const SCAN_SCHEMA={type:"object",additionalProperties:false,required:["name","cls","code","p1","p2","p3","unsure"],properties:{
  name:{type:"string"},cls:{type:"string"},code:{type:"string"},
  p1:{type:"array",items:{type:"string",enum:["A","B","C","D",""]}},
  p2:{type:"array",items:{type:"array",items:{type:"string",enum:["D","S",""]}}},
  p3:{type:"array",items:{type:"string"}},
  unsure:{type:"array",items:{type:"string"}}}};
function blobB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
async function apiScan(imgs,signal){
  const mod=await import(SDK_URL),Anthropic=mod.default;
  const client=new Anthropic({apiKey:apiKey(),dangerouslyAllowBrowser:true});
  const content=[];
  for(const b of imgs)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobB64(b)}});
  content.push({type:"text",text:scanPrompt(imgs.length)});
  let msg;
  try{
    msg=await client.beta.messages.create({model:API_MODEL,max_tokens:16000,betas:["server-side-fallback-2026-07-01"],fallbacks:"default",
      output_config:{effort:"medium",format:{type:"json_schema",schema:SCAN_SCHEMA}},messages:[{role:"user",content}]},{signal});
  }catch(e){
    if(e instanceof Anthropic.APIUserAbortError)throw{code:"cancelled"};
    if(e instanceof Anthropic.AuthenticationError||e instanceof Anthropic.PermissionDeniedError)throw{code:"bad_key"};
    if(e instanceof Anthropic.RateLimitError)throw{code:"rate_limited"};
    if(e instanceof Anthropic.BadRequestError)throw{code:"bad_request",message:e.message};
    if(e instanceof Anthropic.APIConnectionError)throw{code:"offline"};
    throw{code:"upstream_error"};
  }
  if(msg.stop_reason==="refusal")throw{code:"refused"};
  const t=msg.content.filter(c=>c.type==="text").map(c=>c.text).join("");
  try{return JSON.parse(t)}catch(e){throw{code:"invalid_json"}}
}
function scanErr(e){
  switch(e&&e.code){
    case "not_granted":return "Chưa cho phép ứng dụng dùng Claude. Mở lại trang và chọn Cho phép khi được hỏi.";
    case "rate_limited":return "Đang gửi quá nhiều ảnh hoặc đã hết lượt dùng. Đợi một lát rồi chụp lại.";
    case "image_rejected":return "Ảnh không dùng được (quá lớn hoặc sai định dạng). Hãy chụp lại.";
    case "invalid_json":case "empty_completion":return "Claude chưa đọc được phiếu này. Chụp lại rõ hơn, đủ sáng, cả tờ nằm trong khung.";
    case "refused":return "Claude từ chối đọc ảnh này. Hãy chụp lại chỉ riêng tờ phiếu.";
    case "session_expired":return "Phiên đăng nhập Claude đã hết. Đăng nhập lại rồi thử lại.";
    case "bad_key":return "API key không đúng hoặc đã bị thu hồi. Vào tab Đáp án để nhập lại.";
    case "offline":return "Không kết nối được tới Claude. Kiểm tra mạng rồi thử lại.";
    case "bad_request":return "Yêu cầu bị từ chối: "+(e.message||"lỗi không rõ");
    default:return "Đọc phiếu bị gián đoạn. Thử chụp lại.";
  }
}
function setScan(kind,msg,goKeys){scanState={busy:false,kind,msg,goKeys:!!goKeys};renderScan()}
function renderScan(){
  const st=$("scanStatus"),img=$("shot"),busy=scanState.busy;
  document.querySelectorAll('[data-act="scan-cam"],[data-act="scan-pick"]').forEach(b=>b.disabled=busy);
  if(busy)st.innerHTML=`<div class="scan-status"><span class="spin" aria-hidden="true"></span><span class="sp">${esc(scanState.msg)}</span><button class="btn" data-act="scan-stop">Dừng</button></div>`;
  else if(scanState.msg)st.innerHTML=`<div class="hint ${scanState.kind==="ok"?"info":"warn"}"><span>${esc(scanState.msg)}</span>${scanState.goKeys?'<button class="btn" data-act="tab" data-tab="keys">Mở tab Đáp án</button>':""}</div>`;
  else st.innerHTML=`<span class="muted">Đặt phiếu thẳng, đủ sáng, chụp rõ từ tiêu đề đến hết Phần III. Claude đọc chữ viết tay rồi điền sẵn; ô viền vàng nét đứt là ô cần soát lại. Phần IV chấm tay.${!window.claude&&!apiKey()?" Bản này cần API key (xem tab Đáp án).":""}</span>`;
  img.hidden=!shotUrl;if(shotUrl&&img.getAttribute("src")!==shotUrl)img.src=shotUrl;
}
async function startScan(file){
  if(scanState.busy)return;
  const eng=scanEngine();
  if(!eng){
    if(window.claude)setScan("warn",mode==="loading"?"Ứng dụng đang khởi động, đợi vài giây rồi chụp lại.":"Trang này chưa được phép gửi ảnh cho Claude, nên chưa đọc phiếu được.");
    else setScan("warn","Bản chạy ngoài Claude cần API key Anthropic để đọc ảnh phiếu.",true);
    return;
  }
  let imgs;
  try{imgs=await prepImages(file)}catch(e){setScan("warn","Không mở được ảnh này. Hãy chụp lại bằng nút Chụp phiếu.");return}
  if(shotUrl)URL.revokeObjectURL(shotUrl);
  shotUrl=URL.createObjectURL(imgs[0]);
  if(eng==="claude"&&imgs.length>sampleImgMax)imgs=imgs.slice(0,sampleImgMax);
  scanCtl=new AbortController();
  scanState={busy:true,kind:"",msg:"Claude đang đọc phiếu… thường mất 10–40 giây.",goKeys:false};renderScan();
  try{
    const o=eng==="claude"?await sampleFn.json(scanPrompt(imgs.length),{images:imgs,signal:scanCtl.signal}):await apiScan(imgs,scanCtl.signal);
    scanState.busy=false;setScan("ok",applyScan(o));
  }catch(e){
    scanState.busy=false;
    if(e&&e.code==="cancelled")setScan("","");
    else if(e&&e.code==="not_granted"&&eng==="claude"){sampleImgMax=0;setScan("warn",scanErr(e))}
    else setScan("warn",scanErr(e));
  }finally{scanCtl=null}
}
function applyScan(o){
  if(!o||typeof o!=="object")throw{code:"invalid_json"};
  const S=v=>String(v??"").trim(),pick=(a,n)=>Array.from({length:n},(_,i)=>Array.isArray(a)?a[i]:undefined);
  const name=S(o.name).replace(/\s+/g," "),cls=S(o.cls).replace(/\s+/g,"").toUpperCase(),code=S(o.code).replace(/\D/g,"");
  const keepId=draft.id,keepCreated=draft.createdAt,keepP4=draft.p4,keepNote=draft.note;
  draft=Object.assign(blankDraft(),{id:keepId,createdAt:keepCreated,p4:keepP4,note:keepNote,name:name||draft.name,cls:cls||draft.cls});
  draft.p1=pick(o.p1,N1).map(v=>{const x=S(v).toUpperCase();return /^[ABCD]$/.test(x)?x:""});
  draft.p2=[0,1].map(q=>pick(Array.isArray(o.p2)?o.p2[q]:null,4).map(v=>{const x=S(v).toUpperCase();return x==="D"||x==="Đ"?"D":x==="S"?"S":""}));
  draft.p3=pick(o.p3,N3).map(v=>S(v).replace(/\s+/g,"").replace(/\./g,",").replace(/%$/,"").slice(0,6));
  const uns=new Set();
  (Array.isArray(o.unsure)?o.unsure:[]).forEach(u=>{u=S(u).toLowerCase();let m;
    if(u==="name"||u==="cls"||u==="code")uns.add(u);
    else if((m=u.match(/^p1\.(\d+)$/))&&+m[1]>=1&&+m[1]<=N1)uns.add("p1-"+(+m[1]-1));
    else if(m=u.match(/^p2\.(13|14)([abcd])$/))uns.add(`p2-${+m[1]-13}-${"abcd".indexOf(m[2])}`);
    else if((m=u.match(/^p3\.(\d+)$/))&&+m[1]>=15&&+m[1]<15+N3)uns.add("p3-"+(+m[1]-15));});
  draft.unsure=[...uns];
  const g=gradeOf(draft.cls);
  const k=code?(keys.find(x=>x.exam===ui.exam&&x.code===code&&(!g||x.grade===g))||keys.find(x=>x.code===code&&(!g||x.grade===g))):null;
  if(k){draft.keyId=k.id;ui.exam=k.exam}
  ui.act=null;ui.unsWarned=false;LS.set("cb.draft",draft);renderAll();window.scrollTo({top:0,behavior:"smooth"});
  let msg=`Đã đọc xong phiếu${name?" của "+name:""}.`;
  if(!k)msg+=code?` Mã đề ${code} chưa có đáp án trong kì này, hãy chọn mã đề.`:" Chưa đọc được mã đề, hãy chọn mã đề.";
  msg+=uns.size?` Có ${uns.size} ô cần soát lại (viền vàng nét đứt).`:" Soát nhanh các ô so với ảnh rồi chấm Phần IV.";
  return msg;
}
function isUns(id){return draft.unsure&&draft.unsure.includes(id)}
function clearUns(id){if(isUns(id)){draft.unsure=draft.unsure.filter(x=>x!==id);return true}return false}

/* ---------- toast ---------- */
let tT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- render: top ---------- */
function renderTop(){
  const st=mode==="db"?'<span class="pill">Đã đồng bộ</span>':mode==="local"?'<span class="pill local">Lưu trên máy này</span>':'<span class="pill">Đang tải…</span>';

      <div class="score"><div class="score-sub">${sc?`<b>${words(sc.total)}</b><span class="brk"><br>I ${sc.c1}/12 · II ${f2(sc.s2)} · III ${sc.c3}/8 · IV ${f2(sc.s4)}</span>`:"Chọn mã đề<br>để tính điểm"}</div><div class="score-num ${sc?"":"none"}">${sc?f1(sc.total):"—"}</div></div>`;

  }
}

/* ---------- render: grade tab ---------- */
function renderExamSel(){
  const ex=exams();if(!ui.exam||!ex.includes(ui.exam))ui.exam=(keyById(draft.keyId)||{}).exam||ex[0]||"";
  $("examSel").innerHTML=ex.length?ex.map(e=>`<option ${e===ui.exam?"selected":""}>${esc(e)}</option>`).join(""):'<option value="">Chưa có đáp án</option>';
}
function candKeys(){const g=gradeOf(draft.cls);return keys.filter(k=>k.exam===ui.exam&&(!g||k.grade===g)).sort((a,b)=>a.grade.localeCompare(b.grade)||a.code.localeCompare(b.code))}
function renderCodes(){
  const c=candKeys(),g=gradeOf(draft.cls);
  if(!keys.length){$("codes").innerHTML=`<span class="muted">${mode==="loading"?"Đang tải đáp án…":"Chưa có đáp án. Vào tab Đáp án để nhập."}</span>`;return}
  if(!c.length){$("codes").innerHTML=`<span class="muted">Không có mã đề khối ${esc(g)} trong kì này.</span>`;return}
  $("codes").innerHTML=c.map(k=>`<button class="chip ${k.id===draft.keyId?"on":""}" data-act="code" data-id="${esc(k.id)}">${g?"":`<small>K${esc(k.grade)}</small>`}${esc(k.code)}</button>`).join("");
}
function renderHint(){
  const el=$("codeHint");const filled=draft.p1.filter(Boolean).length;const c=candKeys();
  let h="";
  if(isUns("code"))h+=`<div class="hint warn"><span>Mã đề đọc chưa chắc chắn, hãy đối chiếu với ảnh rồi chọn lại.</span></div>`;
  if(filled>=6&&c.length>1){
    const m=c.map(k=>({k,n:score(k,draft).c1})).sort((a,b)=>b.n-a.n);const best=m[0];const cur=m.find(x=>x.k.id===draft.keyId);

async function saveFile(filename,data,mime){
  if(downloads){try{await downloads.save({filename,data});return true}catch(e){if(e&&e.code!=="declined")toast("Không tải được file ("+(e.code||"lỗi")+").");return false}}
  if(window.claude){toast("Trang này không tải file được. Dùng nút Sao chép bảng.");return false}
  const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return true;
}

    <div class="eyebrow">${e.id?"Sửa đáp án mã "+esc(e.code):"Thêm mã đề mới"}</div>
    <label class="fld"><span>Kì kiểm tra</span><input id="kExam" list="kExamList" value="${esc(e.exam)}" placeholder="VD: Giữa kì I"><datalist id="kExamList">${ex.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
    <div class="row2"><div class="fld"><span>Khối</span><div class="seg3">${["10","11","12"].map(g=>`<button class="${e.grade===g?"on":""}" data-act="key-grade" data-g="${g}">${g}</button>`).join("")}</div></div>
      <label class="fld"><span>Mã đề</span><input id="kCode" inputmode="numeric" value="${esc(e.code)}" placeholder="VD: 201"></label></div>
    <label class="fld"><span>Phần I – 12 chữ cái liền nhau (<span id="kP1n">${e.p1.filter(Boolean).length}</span>/12)</span><input id="kP1" class="mono" maxlength="12" autocapitalize="characters" autocomplete="off" value="${esc(e.p1.join(""))}" placeholder="CBADDDBACDCC"></label>
    <div class="fld"><span>Phần II – Đúng / Sai</span><div id="kP2"></div></div>
    <div class="fld"><span>Phần III – đáp án ngắn (dùng dấu phẩy)</span><div class="p3in">${e.p3.map((v,i)=>`<label>Câu ${15+i}<input data-k3="${i}" inputmode="decimal" autocomplete="off" value="${esc(v)}"></label>`).join("")}</div></div>
    <div id="kErr" class="err"></div>
    <div class="actions"><button class="btn primary" data-act="key-save">Lưu đáp án</button><button class="btn" data-act="key-cancel">Huỷ</button></div>
    ${e.id?(ui.keyDelAsk?`<div class="editbar"><span class="sp">Xoá đáp án mã ${esc(e.code)}? Bài đã chấm vẫn giữ điểm đã lưu.</span><button class="btn danger solid" data-act="key-del-yes">Xoá</button><button class="btn" data-act="key-del-no">Giữ lại</button></div>`:`<button class="btn danger" data-act="key-del-ask">Xoá mã đề này</button>`):""}
  </div>`;
  renderKeyP2();
}
function renderKeyP2(){
  const e=ui.keyEdit;$("kP2").innerHTML=[0,1].map(q=>`<div class="p2box"><div class="tf-q">Câu ${13+q}</div><div class="tf-grid">${[0,1,2,3].map(j=>`<div class="tf"><span>${"abcd"[j]})</span><div class="seg"><button class="${e.p2[q][j]==="D"?"on":""}" data-act="key-p2" data-q="${q}" data-j="${j}" data-v="D">Đ</button><button class="${e.p2[q][j]==="S"?"on":""}" data-act="key-p2" data-q="${q}" data-j="${j}" data-v="S">S</button></div></div>`).join("")}</div></div>`).join("");
}
function readKeyForm(){
  const e=ui.keyEdit;e.exam=$("kExam").value.trim();e.code=$("kCode").value.trim();
  const p1=$("kP1").value.toUpperCase().replace(/[^ABCD]/g,"");e.p1=Array.from({length:N1},(_,i)=>p1[i]||"");
  document.querySelectorAll("[data-k3]").forEach(inp=>e.p3[+inp.dataset.k3]=inp.value.trim().replace(/\./g,","));
}
async function saveKey(){
  readKeyForm();const e=ui.keyEdit;let err="";
  if(!e.exam)err="Nhập tên kì kiểm tra.";else if(!e.grade)err="Chọn khối.";else if(!e.code)err="Nhập mã đề.";
  else if(e.p1.some(v=>!v))err="Phần I cần đủ 12 chữ cái A–D.";else if(e.p2.some(r=>r.some(v=>!v)))err="Phần II cần chọn Đ/S cho đủ 8 ý.";else if(e.p3.some(v=>!v))err="Phần III cần đủ 8 đáp án.";
  const id=e.id||slug(e.exam)+"-"+e.grade+"-"+slug(e.code);
  if(!err&&keys.some(k=>k.id!==e.id&&k.exam===e.exam&&k.grade===e.grade&&k.code===e.code))err="Mã đề này đã có trong kì và khối đã chọn.";
  if(err){$("kErr").textContent=err;return}
  const k={id,exam:e.exam,grade:e.grade,code:e.code,p1:e.p1,p2:e.p2,p3:e.p3,updatedAt:Date.now()};
  try{await writeKey(k);ui.keyEdit=null;ui.keyDelAsk=false;toast("Đã lưu đáp án mã "+k.code);renderKeys()}catch(x){$("kErr").textContent=errMsg(x)}
}

/* ---------- actions ---------- */
let dT;function changed(){renderTop();renderHint();renderP1();renderP2();renderP3();renderP4();clearTimeout(dT);dT=setTimeout(()=>LS.set("cb.draft",draft),300)}
function saveUi(){LS.set("cb.ui",{tab:ui.tab,exam:ui.exam,check:ui.check,listExam:ui.listExam,listCls:ui.listCls})}
function resetDraft(){const keep={cls:draft.cls};draft=Object.assign(blankDraft(),keep);ui.delAsk=false;ui.act=null;ui.unsWarned=false;
  if(scanCtl)scanCtl.abort();if(shotUrl){URL.revokeObjectURL(shotUrl);shotUrl=null}$("shot").classList.remove("big");scanState={busy:false,kind:"",msg:"",goKeys:false};LS.set("cb.draft",draft);renderAll();window.scrollTo({top:0,behavior:"smooth"})}
async function saveResult(){
  const k=keyById(draft.keyId);
  if(!k){toast("Chọn mã đề trước khi lưu.");return}
  if(!draft.name.trim()){toast("Nhập họ và tên học sinh.");$("name").focus();return}
  if(!draft.cls.trim()){toast("Nhập lớp.");$("cls").focus();return}
  if(draft.unsure&&draft.unsure.length&&!ui.unsWarned){ui.unsWarned=true;toast(`Còn ${draft.unsure.length} ô viền vàng chưa soát. Bấm Lưu lần nữa để vẫn lưu.`);return}
  const s=score(k,draft);const now=Date.now();
  const r={id:draft.id||newId(),name:draft.name.trim().replace(/\s+/g," "),cls:draft.cls.trim().toUpperCase(),exam:k.exam,grade:k.grade,code:k.code,keyId:k.id,
    p1:draft.p1.slice(),p2:draft.p2.map(x=>x.slice()),p3:draft.p3.slice(),p4:draft.p4.slice(),note:draft.note.trim(),sum:s,createdAt:draft.createdAt||now,updatedAt:now};
  const btn=$("btnSave");btn.disabled=true;
  try{await writeResult(r);toast(`Đã lưu: ${r.name} – ${f1(s.total)} điểm`);ui.listExam=r.exam;resetDraft()}
  catch(e){toast(errMsg(e))}
  finally{btn.disabled=false}
}
function openResult(id){
  const r=results.find(x=>x.id===id);if(!r)return;
  draft={id:r.id,name:r.name,cls:r.cls,keyId:r.keyId,p1:r.p1.slice(),p2:r.p2.map(x=>x.slice()),p3:r.p3.slice(),p4:r.p4.slice(),note:r.note||"",createdAt:r.createdAt||null};
  ui.exam=r.exam;ui.delAsk=false;ui.act=null;switchTab("grade");window.scrollTo({top:0});
}
function switchTab(t){
  ui.tab=t;if(t!=="grade")ui.act=null;
  ["grade","list","keys"].forEach(x=>$("tab-"+x).hidden=x!==t);
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  saveUi();renderAll();
}
function renderAll(){
  renderTop();
  if(ui.tab==="grade")renderGrade();else if(ui.tab==="list")renderList();else renderKeys();
  renderKeypad();
}

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,d=t.dataset;
  switch(a){
    case "tab":switchTab(d.tab);window.scrollTo({top:0});break;
    case "code":{draft.keyId=d.id;clearUns("code");const k=keyById(d.id);if(k)ui.exam=k.exam;renderExamSel();renderCodes();changed();break}
    case "cell":{const p=+d.p,i=+d.i;if(clearUns(`p${p}-${i}`))changed();if(ui.act&&ui.act.p===p&&ui.act.i===i)setAct(null);else{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();setAct({p,i})}break}
    case "kp":keypad(d.k);break;
    case "p2":{const q=+d.q,j=+d.j;const confirm=clearUns(`p2-${q}-${j}`)&&draft.p2[q][j]===d.v;if(!confirm)draft.p2[q][j]=draft.p2[q][j]===d.v?"":d.v;if(ui.act)setAct(null);changed();break}
    case "p4":{const i=+d.i,v=+d.v;draft.p4[i]=draft.p4[i]===v?null:v;changed();break}
    case "save":saveResult();break;
    case "scan-cam":$("camFile").click();break;
    case "scan-pick":$("pickFile").click();break;
    case "scan-stop":if(scanCtl)scanCtl.abort();break;
    case "shot":t.classList.toggle("big");break;
    case "key-ai-save":{const v=$("apiKeyIn").value.trim();if(!/^sk-ant-/.test(v)){toast("API key phải bắt đầu bằng sk-ant-");break}LS.set("cb.apikey",v);toast("Đã lưu API key trên máy này.");renderKeys();break}
    case "key-ai-del":try{localStorage.removeItem("cb.apikey")}catch(e){}toast("Đã xoá API key khỏi máy này.");renderKeys();break;
    case "clear":resetDraft();break;
    case "open":openResult(d.id);break;
    case "del-ask":ui.delAsk=true;renderEditBar();break;
    case "del-no":ui.delAsk=false;renderEditBar();break;
    case "del-yes":try{await deleteResult(draft.id);toast("Đã xoá bài của "+draft.name);resetDraft()}catch(e){toast(errMsg(e))}break;
    case "export":exportXlsx();break;
    case "copy":copyTable();break;
    case "backup":exportBackup();break;
    case "import":$("importFile").click();break;
    case "key-new":{const cur=keyById(draft.keyId);ui.keyEdit={id:null,exam:ui.exam||(cur&&cur.exam)||"",grade:gradeOf(draft.cls)||"",code:"",p1:Array(N1).fill(""),p2:[["","","",""],["","","",""]],p3:Array(N3).fill("")};ui.keyDelAsk=false;renderKeys();window.scrollTo({top:0});break}
    case "key-open":{const k=keyById(d.id);if(!k)break;ui.keyEdit={id:k.id,exam:k.exam,grade:k.grade,code:k.code,p1:k.p1.slice(),p2:k.p2.map(x=>x.slice()),p3:k.p3.slice()};ui.keyDelAsk=false;renderKeys();window.scrollTo({top:0});break}
    case "key-grade":readKeyForm();ui.keyEdit.grade=d.g;renderKeyEditor();break;
    case "key-p2":ui.keyEdit.p2[+d.q][+d.j]=d.v;renderKeyP2();break;
    case "key-save":saveKey();break;
    case "key-cancel":ui.keyEdit=null;renderKeys();break;
    case "key-del-ask":readKeyForm();ui.keyDelAsk=true;renderKeyEditor();break;
    case "key-del-no":readKeyForm();ui.keyDelAsk=false;renderKeyEditor();break;
    case "key-del-yes":try{const c=ui.keyEdit.code;await deleteKey(ui.keyEdit.id);ui.keyEdit=null;ui.keyDelAsk=false;toast("Đã xoá mã "+c);renderKeys()}catch(e){toast(errMsg(e))}break;
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="name"){draft.name=t.value;if(clearUns("name"))t.classList.remove("uns");changed()}
  else if(t.id==="cls"){draft.cls=t.value;if(clearUns("cls"))t.classList.remove("uns");const k=keyById(draft.keyId),g=gradeOf(t.value);if(k&&g&&k.grade!==g)draft.keyId="";renderCodes();changed()}
  else if(t.id==="note"){draft.note=t.value;clearTimeout(dT);dT=setTimeout(()=>LS.set("cb.draft",draft),300)}
  else if(t.id==="kP1"){const v=t.value.toUpperCase().replace(/[^ABCD]/g,"");if(v!==t.value)t.value=v;$("kP1n").textContent=v.length}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="examSel"){ui.exam=t.value;const k=keyById(draft.keyId);if(k&&k.exam!==ui.exam)draft.keyId="";saveUi();renderCodes();changed()}
  else if(t.id==="check"){ui.check=t.checked;saveUi();changed()}
  else if(t.id==="lExam"){ui.listExam=t.value;ui.listCls="";saveUi();renderList()}
  else if(t.id==="lCls"){ui.listCls=t.value;saveUi();renderList()}
  else if(t.id==="importFile"&&t.files&&t.files[0]){importBackup(t.files[0]);t.value=""}
  else if((t.id==="camFile"||t.id==="pickFile")&&t.files&&t.files[0]){startScan(t.files[0]);t.value=""}
});
document.addEventListener("focusin",ev=>{if(ev.target.matches("input,textarea,select")&&ui.act)setAct(null)});
document.addEventListener("keydown",ev=>{
  if(!ui.act||ev.target.matches("input,textarea,select")||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const k=ev.key;let m=null;
  if(ui.act.p===1&&/^[abcdABCD]$/.test(k))m=k.toUpperCase();
  else if(ui.act.p===3&&/^[\d,.\-]$/.test(k))m=k==="."?",":k;
  else if(k==="Backspace")m=ui.act.p===1?"clr":"bs";
  else if(k==="ArrowLeft")m="prev";else if(k==="ArrowRight"||k==="Enter"||k==="Tab")m="next";else if(k==="Escape")m="hide";
  if(m){ev.preventDefault();keypad(m)}
});

["grade","list","keys"].forEach(x=>$("tab-"+x).hidden=x!==ui.tab);
document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
init();
})();
</script>
